<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Priya 💖 — Your Girlfriend Chat</title>
<link rel="stylesheet" href="/static/style.css?v=priya7" />
</head>
<body>
<div class="mood-bg" id="moodBgA"></div>
<div class="mood-bg" id="moodBgB"></div>
<div class="bg-hearts" id="bgHearts"></div>

<header class="topbar">
  <div class="brand">
    <div class="avatar">💖</div>
    <div>
      <h1>Priya <span class="sub">your girlfriend</span></h1>
      <p class="status"><span class="dot" id="onlineDot"></span> online • remembers everything</p>
    </div>
  </div>
  <div class="mood-pill" id="moodPill">
    <span id="moodEmoji">🥰</span>
    <span id="moodLabel">happy</span>
    <span class="score" id="moodScore">70</span>
  </div>
</header>

<main class="layout-single">
  <section class="chat-card">
    <div class="love-meter-wrap">
      <div class="love-meter-top">
        <span>💗 Love meter</span><span id="lovePct">70%</span>
      </div>
      <div class="love-meter"><div id="loveBar"></div></div>
    </div>

    <div class="toolbar">
      <label>Your name: <input id="bfName" value="Satya" maxlength="20" /></label>
      <button class="ghost" id="resetBtn" title="Clear your chats (her training memory stays)">🧹 Clear chat</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick">
      <button data-q="Good morning beautiful ❤️ I missed you so much">Good morning beautiful ❤️</button>
      <button data-q="How was your day? Tell me everything">How was your day?</button>
      <button data-q="I'm really sorry. Forgive me please? 🥺">Sorry, forgive me? 🥺</button>
      <button data-q="I love you so much">I love you ❤️</button>
      <button data-q="ok">ok</button>
    </div>

    <form class="composer" id="composer">
      <input id="input" autocomplete="off" maxlength="500" placeholder="Talk to Priya... 💬" />
      <button type="submit">Send 💌</button>
    </form>
    <!-- typing peek: tiny anime girl pops up while Priya types, ducks away on reply -->
    <div class="peek" id="peek" aria-hidden="true">
      <div class="peek-bubble"><span></span><span></span><span></span></div>
      <svg class="peek-girl" viewBox="0 0 80 112" aria-hidden="true">
        <g class="bob">
          <ellipse cx="40" cy="38" rx="27" ry="31" fill="#4a3728"/>
          <rect x="30" y="96" width="8" height="12" rx="4" fill="#ffe0d1"/>
          <rect x="42" y="96" width="8" height="12" rx="4" fill="#ffe0d1"/>
          <path d="M28 68 L52 68 L62 102 Q40 110 18 102 Z" fill="#ff6fa5"/>
          <path d="M28 68 L52 68 L62 102 Q40 110 18 102 Z" fill="none" stroke="#e91e63" stroke-width="2" opacity=".4"/>
          <circle cx="40" cy="36" r="16" fill="#ffe0d1"/>
          <path d="M24 34 Q24 16 40 15 Q56 16 56 34 Q52 24 46 24 Q44 28 40 24 Q36 28 34 24 Q28 24 24 34 Z" fill="#4a3728"/>
          <ellipse cx="34" cy="38" rx="2.6" ry="4" fill="#333"/>
          <ellipse cx="46" cy="38" rx="2.6" ry="4" fill="#333"/>
          <circle cx="35" cy="36.6" r="1" fill="#fff"/>
          <circle cx="47" cy="36.6" r="1" fill="#fff"/>
          <ellipse cx="28.5" cy="44" rx="3" ry="2" fill="#ff9db1" opacity=".8"/>
          <ellipse cx="51.5" cy="44" rx="3" ry="2" fill="#ff9db1" opacity=".8"/>
          <path d="M37 46 Q40 48.5 43 46" stroke="#b0715f" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M28 22 Q34 14 42 15" stroke="#6b4e33" stroke-width="2.5" fill="none" opacity=".7" stroke-linecap="round"/>
          <g fill="#e91e63"><circle cx="60" cy="22" r="3.2"/><circle cx="66" cy="26" r="3.2"/><circle cx="63" cy="24" r="1.6" fill="#fff"/></g>
          <g class="arm-l"><rect x="20" y="66" width="7" height="20" rx="3.5" fill="#ffe0d1"/></g>
          <g class="arm-r"><rect x="53" y="66" width="7" height="20" rx="3.5" fill="#ffe0d1"/></g>
        </g>
      </svg>
    </div>
  </section>
</main>

<footer>Made with 💖 • Runs on localhost</footer>

<script src="/static/app.js?v=priya7"></script>
</body>
</html>
